<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="beamGrad" x1="60" y1="36" x2="115" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#155e4e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamGradLeft" x1="60" y1="36" x2="5" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#155e4e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="45" y1="30" x2="75" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Signal Beams -->
  <polygon points="60,35 118,5 112,28" fill="url(#beamGrad)" />
  <polygon points="60,35 2,5 8,28" fill="url(#beamGradLeft)" />

  <!-- Base Rock / Pedestal -->
  <path d="M32 104 L88 104 L84 96 L36 96 Z" fill="#1e293b" stroke="#10b981" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="28" y="104" width="64" height="4" rx="2" fill="#0f172a" stroke="#155e4e" stroke-width="1"/>

  <!-- Lower Tower -->
  <path d="M38 96 L42 66 L78 66 L82 96 Z" fill="url(#towerGrad)" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Stripes on lower tower -->
  <path d="M40 82 L80 82 L79 74 L41 74 Z" fill="#107e5b"/>
  <!-- Doorway / Window -->
  <rect x="56" y="80" width="8" height="14" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>

  <!-- Middle Gallery / Balcony -->
  <rect x="39" y="62" width="42" height="4" rx="1" fill="#10b981" />
  <line x1="41" y1="62" x2="41" y2="58" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="49" y1="62" x2="49" y2="58" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="60" y1="62" x2="60" y2="58" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="71" y1="62" x2="71" y2="58" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="79" y1="62" x2="79" y2="58" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="39" y1="58" x2="81" y2="58" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Upper Gallery Room -->
  <path d="M45 58 L47 42 L73 42 L75 58 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="55" y="46" width="10" height="8" rx="1" fill="#0f172a" stroke="#10b981" stroke-width="1"/>

  <!-- Lantern Room & Dome -->
  <rect x="46" y="38" width="28" height="4" fill="#107e5b"/>
  <!-- Glass Enclosure -->
  <rect x="50" y="28" width="20" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="56" y1="28" x2="56" y2="38" stroke="#0f172a" stroke-width="1"/>
  <line x1="64" y1="28" x2="64" y2="38" stroke="#0f172a" stroke-width="1"/>
  
  <!-- Glowing Lamp Core -->
  <circle cx="60" cy="33" r="5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="60" cy="33" r="2.5" fill="#ffffff"/>

  <!-- Top Dome and Spire -->
  <path d="M49 28 Q60 18 71 28 Z" fill="#107e5b" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="60" y1="18" x2="60" y2="9" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="8" r="2" fill="#ffffff"/>
</svg>
