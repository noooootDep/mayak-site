<!DOCTYPE html>
<html lang="ru" class="scroll-smooth" id="top">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Интересные факты — ООО «Маяк»</title>
  <meta name="description" content="Короткие заметки ООО «Маяк» о промышленной безопасности и неразрушающем контроле."/>
  <link rel="icon" href="./assets/images/logo-shield.png"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:"#141414",paper:"#f4f7f3",rose:"#c45c64","rose-deep":"#1f6b45",green:"#1f6b45","green-deep":"#134830",line:"#d5e0d6",muted:"#5d6a60"},fontFamily:{display:["Cormorant Garamond","serif"],antique:["Cormorant Garamond","serif"],body:["Manrope","sans-serif"],"mono-tech":["Space Grotesk","sans-serif"]}}}};</script>
  <link rel="stylesheet" href="./css/brand.css?v=31"/>
</head>
<body class="bg-paper text-ink antialiased min-h-screen flex flex-col">
  <div id="site-top"></div>
  <main class="flex-1 pt-28 sm:pt-32">
    <section class="px-4 sm:px-10 lg:px-14 py-16 border-b border-line">
      <div class="max-w-[1440px] mx-auto">
        <p class="font-mono-tech text-[10px] uppercase tracking-[0.28em] text-rose-deep mb-4">Что здесь</p>
        <h1 class="font-display text-4xl sm:text-6xl max-w-4xl mb-6">Интересные факты</h1>
        <p class="text-lg text-muted max-w-3xl leading-relaxed">В этом разделе размещена интересная, на наш взгляд, информация в кратком изложении, без скучных подробностей. Она будет обо всем, о чем нам захочется вам рассказать.</p>
      </div>
    </section>
    <section class="px-4 sm:px-10 lg:px-14 py-16">
      <div id="facts-list" class="max-w-[900px] mx-auto flex flex-col gap-5" aria-busy="true">
        <article class="bg-white border border-line rounded-[20px] p-6 sm:p-8">
          <p class="text-[12px] uppercase tracking-widest text-rose-deep font-bold mb-4">Загрузка</p>
          <div class="h-3 w-2/3 rounded-full bg-[#e7efe8] mb-3"></div>
          <div class="h-3 w-full rounded-full bg-[#e7efe8] mb-3"></div>
          <div class="h-3 w-5/6 rounded-full bg-[#e7efe8]"></div>
        </article>
        <article class="bg-white border border-line rounded-[20px] p-6 sm:p-8">
          <div class="h-3 w-1/3 rounded-full bg-[#e7efe8] mb-4"></div>
          <div class="h-3 w-full rounded-full bg-[#e7efe8] mb-3"></div>
          <div class="h-3 w-4/5 rounded-full bg-[#e7efe8]"></div>
        </article>
      </div>
      <script>
        (function () {
          var sheet = "https://docs.google.com/spreadsheets/d/1aRSZ9lUoYGWAzf0NYd72ayRXGRGSsJIv_PTqkohDk30/export?format=csv&gid=0";
          function parseCsv(text) {
            var rows = [], row = [], cur = "", quoted = false;
            for (var i = 0; i < text.length; i++) {
              var ch = text.charAt(i);
              if (quoted) {
                if (ch === '"') {
                  if (text.charAt(i + 1) === '"') { cur += '"'; i++; }
                  else quoted = false;
                } else cur += ch;
              } else if (ch === '"') quoted = true;
              else if (ch === ",") { row.push(cur); cur = ""; }
              else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
              else if (ch !== "\r") cur += ch;
            }
            if (cur.length || row.length) { row.push(cur); rows.push(row); }
            return rows;
          }
          function stamp(value) {
            var match = String(value || "").match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
            return match ? Date.UTC(+match[3], +match[2] - 1, +match[1]) : 0;
          }
          function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (ch) {
              return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
            });
          }
          fetch(sheet + "&cb=" + Date.now()).then(function (res) {
            if (!res.ok) throw new Error("sheet");
            return res.text();
          }).then(function (text) {
            var facts = parseCsv(text).slice(1).map(function (cells) {
              return { date: (cells[0] || "").trim(), text: (cells[1] || "").trim() };
            }).filter(function (item) { return item.text; });
            facts.sort(function (a, b) { return stamp(b.date) - stamp(a.date); });
            var list = document.getElementById("facts-list");
            list.removeAttribute("aria-busy");
            if (!facts.length) {
              list.innerHTML = '<p class="text-muted">Пока нет заметок.</p>';
              return;
            }
            list.innerHTML = facts.map(function (item) {
              return '<article class="bg-white border border-line rounded-[20px] p-6 sm:p-8"><p class="text-[12px] uppercase tracking-widest text-rose-deep font-bold mb-3">Размещено ' + escapeHtml(item.date) + '</p><p class="leading-relaxed">' + escapeHtml(item.text) + '</p></article>';
            }).join("");
          }).catch(function () {
            var list = document.getElementById("facts-list");
            list.removeAttribute("aria-busy");
            list.innerHTML = '<p class="text-muted">Не удалось загрузить заметки. Обновите страницу.</p>';
          });
        })();
      </script>
    </section>
  </main>
  <div id="site-bottom"></div>
  <script src="./js/chrome.js?v=19"></script>
</body>
</html>
